plugins {
    id 'com.android.application'
}

android {
    namespace 'br.dsn.equalizador'
    compileSdk 34

    defaultConfig {
        applicationId "br.dsn.equalizador"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
